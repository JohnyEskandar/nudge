project_id = "nudge"

[functions.daily-nudge]
# The function additionally checks the bearer matches the service role key, so a
# stray anon-key call is rejected even though it would pass JWT verification.
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.announce]
# Same shape as daily-nudge: JWT verification at the gateway, plus its own check that
# the bearer is the service key. Nothing schedules this one — it only fires by hand.
verify_jwt = true
